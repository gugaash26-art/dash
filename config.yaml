server:
  host: 0.0.0.0
  port: 8080

serial:
  enabled: true
  auto_detect: true
  port: /dev/ttyUSB0
  baud: 115200
  candidates:
    - /dev/ttyUSB0
    - /dev/ttyACM0
    - /dev/ttyAMA0
    - /dev/ttyS4
  reconnect_s: 2.0

simulation:
  enabled: false
  drive: false

rates:
  broadcast_hz: 10
  log_hz: 1

units:
  speed: kmh
  temp: c
  pressure: psi
  volume: l

thresholds:
  coolant_warn_c: 100
  coolant_crit_c: 106
  volt_warn_v: 12.2
  volt_crit_v: 11.8
  fuel_warn_pct: 12
  oil_warn_psi: 25
  oil_crit_psi: 15
  rpm_warn: 5800
  speed_warn: 0

trip:
  fuel_capacity_l: 55
  consumption_l100: 8.5
  odometer_km: 0
  idle_lh: 0.9

car:
  name: OpenDash
  model: Projetor
  engine: 2.0

gps:
  enabled: true
  source: auto          # auto | arduino | usb | off
  port: ""              # vazio = auto-detectar (USB no Orange Pi)
  baud: 9600
  candidates:
    - /dev/ttyACM0
    - /dev/ttyACM1
    - /dev/ttyUSB1
    - /dev/gps
    - /dev/serial0
  reconnect_s: 3.0
  track_minutes: 180

maps:
  provider: osm         # osm | google
  tile_url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
  google_key: ""
  zoom: 16

apps:
  seed_defaults: true

agent:                    # assistente de voz (IA) da pagina Multimidia
  enabled: true
  stt: whisper            # voz->texto: whisper (whisper.cpp)
  whisper_bin: whisper-cli
  whisper_model: /car-dash/models/ggml-base.bin
  stt_lang: pt
  mic_device: default     # dispositivo ALSA (arecord -l)
  record_seconds: 6       # duracao maxima do push-to-talk
  llm_provider: groq      # groq | openai-compativel (base_url)
  llm_base_url: https://api.groq.com/openai/v1
  llm_model: llama-3.3-70b-versatile
  llm_key_env: GROQ_API_KEY
  llm_key: ""             # alternativa a variavel de ambiente
  tts: edge               # fala: edge (edge-tts)
  tts_voice: pt-BR-ThalitaMultilingualNeural
  speak: true             # o painel fala a resposta
  play_local: false       # tocar o audio tambem no Orange Pi (aplay/ffplay)
  spotify_client_id: ""   # opcional: permite buscar faixa no Spotify
  spotify_client_secret: ""
  max_turns: 8

update:                   # atualizacao pelo GitHub (botao em Ajustes)
  enabled: true
  remote: origin
  branch: main            # branch que sera baixada
  auto_check: true        # verifica sozinho ao ligar e de tempo em tempo
  check_hours: 6
  install_deps: true      # roda pip install -r requirements.txt apos atualizar
  restart_command: ""     # vazio: tenta systemctl restart cardash e, senao, reinicia sozinho

paths:
  data_dir: /car-dash/data
  db: /car-dash/data/cardash.db

ui:
  boot_animation: true
  theme: auto
  brightness: 100
