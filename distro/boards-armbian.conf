# OpenDash OS (Armbian) - placas e imagens base
#
# Formato: id|nome|slug Armbian|release|variante|incluir no build padrao (1/0)
# As imagens vem de https://dl.armbian.com/<slug>/<Release>_<branch>_<variant>.img.xz
# e o checksum de https://dl.armbian.com/<slug>/<Release>_<branch>_<variant>.sha
#
# branch = current (estavel) | edge | legacy
# variant = minimal (CLI) | xfce (desktop)
#
# O slug e o mesmo usado pela Armbian (ex.: orangepizero3). Para uma placa nova,
# veja o catalogo em https://www.armbian.com/boards/ e confirme o slug em
# https://dl.armbian.com/<slug>/.

